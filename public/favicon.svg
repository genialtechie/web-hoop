      <stop offset="0" stop-color="#26333b" />
      <stop offset="0.55" stop-color="#10171c" />
      <stop offset="1" stop-color="#06090c" />
    </linearGradient>
    <radialGradient id="ball" cx="36%" cy="30%" r="72%">
