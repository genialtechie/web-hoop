      <stop offset="0.59" stop-color="#7b6748" />
      <stop offset="1" stop-color="#4f3b25" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="86" x2="430" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26333b" stop-opacity="0.94" />
      <stop offset="1" stop-color="#0c1216" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe36f" />
      <stop offset="1" stop-color="#d98a1b" />
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.44" stop-color="#2ee6d6" />
