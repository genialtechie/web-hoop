    <path d="M40 66 L40 90 M84 69 L84 96" fill="none" stroke="#97a8b0" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <path d="M38 122 C56 136 86 136 106 120 L113 146 C89 162 52 162 28 146 Z" fill="#ffd24a" stroke="#172026" stroke-width="6" stroke-linejoin="round" />
